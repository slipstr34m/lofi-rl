# - every committed file under assets/ is listed here, with a matching sha256;
# - nothing non-commercial (NC) is ever committed: NC sources are mode=fetch and live in assets/big/ (gitignored).
# Fields: path (relative to the repo), sha256, license, mode (commit|fetch), url, upstream (commit or version), notes.
# Fetch-only entries (docs/SHOOTOUT_ASSETS.md) live under assets/big/ on the laptop and in $REMOTE_KEEP/assets/ on the
# cluster, never in git. A GitHub sample set also gives `include` (path rules applied to the git tree at `upstream`),
# `extra` (files from another commit), `files`, `bytes` and `list_sha256`: the sha256 of its sorted
# 'path<TAB>size<TAB>git-sha1' lines, which that tree reproduces. Every file was checked by its git blob SHA-1 when

sax:
  tenor: {src: gu, bank: 0, prog: 66, play: [44, 75], comfort: [48, 72], home: [50, 61]}   # GU "Tenor Sax"
sax_lead: tenor

keys:
  ep: {src: gu, bank: 0, prog: 4, vel: {X: 96, x: 80, g: 52}}       # GU "Tine Electric Piano"

kits:
  dusty:                                                             # GU Jazz kit 32, as dev_gu's `jazz`
    bass: {src: gu, bank: 0, prog: 32, vel: {X: 104, x: 88, g: 64}}  # GU "Acoustic Bass"
    choke: [[ohat, hat], [ohat, ohat]]
    lanes:
      kick:
        soft: [{src: gu, bank: 128, prog: 32, note: 36, vel: 48}]
        med: [{src: gu, bank: 128, prog: 32, note: 36, vel: 80}]
        hard: [{src: gu, bank: 128, prog: 32, note: 36, vel: 112}]
        pan: 0.0
        db: 0.0
      snare:
        soft: [{src: gu, bank: 128, prog: 32, note: 38, vel: 48}]
        med: [{src: gu, bank: 128, prog: 32, note: 38, vel: 80}]
        hard: [{src: gu, bank: 128, prog: 32, note: 38, vel: 112}]
        pan: 0.0
        db: 0.0
      rim:
        soft: [{src: gu, bank: 128, prog: 32, note: 37, vel: 48}]
        med: [{src: gu, bank: 128, prog: 32, note: 37, vel: 80}]
        hard: [{src: gu, bank: 128, prog: 32, note: 37, vel: 112}]
        pan: 0.0
        db: 0.0
      hat:
        soft: [{src: gu, bank: 128, prog: 32, note: 42, vel: 48}]
        med: [{src: gu, bank: 128, prog: 32, note: 42, vel: 80}]
        hard: [{src: gu, bank: 128, prog: 32, note: 42, vel: 112}]
        pan: 0.0
        db: 0.0
      ohat:
        soft: [{src: gu, bank: 128, prog: 32, note: 46, vel: 48}]
        med: [{src: gu, bank: 128, prog: 32, note: 46, vel: 80}]
        hard: [{src: gu, bank: 128, prog: 32, note: 46, vel: 112}]
        pan: 0.0
        db: 0.0
      shaker:
        soft: [{src: gu, bank: 128, prog: 32, note: 82, vel: 48}]
        med: [{src: gu, bank: 128, prog: 32, note: 82, vel: 80}]
        hard: [{src: gu, bank: 128, prog: 32, note: 82, vel: 112}]
        pan: 0.0
        db: 0.0

aliases: {}

chords:
  numerals: [I, bII, II, bIII, III, IV, V, bVI, VI, bVII, VII]
  qualities: [maj7, maj9, "maj7#11", "7", "9", "13", 7sus, 7b9, "7#9", m7, m9, m11, m7b5, dim7]
voicings: [rootless, shell, spread, quartal]

groove:
  swing: {default: 0.55}
  offset_ms: {}
  humanize: "off"
  humanize_ms: 3.0
  humanize_vel: 0.08
  humanize_lanes: [kick, snare, rim, hat, ohat, shaker, bass, keys]
  drum_gain: {X: 1.0, x: 0.71, g: 0.32}
  metric_db:
    lanes: [hat, shaker]
    db: [0.0, -4.0, -2.0, -4.0, -1.0, -4.0, -2.0, -4.0, 0.0, -4.0, -2.0, -4.0, -1.0, -4.0, -2.0, -4.0]

sax_expr:
  enabled: true
  timing: grid
  lag_ms: 25.0
  swing8: 0.6
  bend_range: 2
  bend_every_ms: 10.0
  cc11_every_ms: 20.0
  gap_ms: 15.0
  scoop: {min_steps: 4, leap: 3, cents: -60.0, ms: 80.0}
  vibrato: {min_steps: 8, start: 0.35, fade_ms: 300.0, cents: 18.0, rate_hz: 5.5}
  cc11: {short: 110, long_steps: 8, long_base: 100, long_swell: 27, last: 80, last_share: 0.4}
  velocity: {base: 92, bar_start: 8, beat3: 4, sixteenth: -10, phrase_start: 6, min: 60, max: 112}

mix:
  bus_gain_db: {sax: 0.0, drums: 0.0, bass: 0.0, keys: 0.0}        # the faders: written per palette (§3 step 5)
  bus_target_lu: {sax: 0.0, drums: -1.5, bass: -3.0, keys: -6.0}
  sax_warm: false
  buses:
    sax:
      - [Gain, {gain_db: 0.0}]                                       # trim slot
      - [HighpassFilter, {cutoff_frequency_hz: 140.0}]
      - [PeakFilter, {cutoff_frequency_hz: 450.0, gain_db: -2.0, q: 1.0}]
      - [Compressor, {threshold_db: -20.0, ratio: 3.0, attack_ms: 8.0, release_ms: 120.0}]
      - [PeakFilter, {cutoff_frequency_hz: 2800.0, gain_db: 2.0, q: 0.8}]
      - [Reverb, {room_size: 0.22, damping: 0.55, wet_level: 0.07, dry_level: 1.0, width: 1.0}]
    sax_warm:
      - [HighShelfFilter, {cutoff_frequency_hz: 4000.0, gain_db: -5.0, q: 0.70710678}]
      - [LowpassFilter, {cutoff_frequency_hz: 9000.0}]
      - [Reverb, {room_size: 0.35, damping: 0.7, wet_level: 0.12, dry_level: 1.0, width: 1.0}]
    keys:
      - [Gain, {gain_db: 0.0}]                                       # trim slot
      - [HighpassFilter, {cutoff_frequency_hz: 120.0}]
      - [PeakFilter, {cutoff_frequency_hz: 400.0, gain_db: -3.0, q: 0.70710678}]
      - [Compressor, {threshold_db: -18.0, ratio: 2.0, attack_ms: 20.0, release_ms: 150.0}]
      - [Reverb, {room_size: 0.3, damping: 0.5, wet_level: 0.1, dry_level: 1.0, width: 1.0}]
    bass:
      - [Gain, {gain_db: 0.0}]                                       # trim slot
      - [HighpassFilter, {cutoff_frequency_hz: 30.0}]
      - [PeakFilter, {cutoff_frequency_hz: 250.0, gain_db: -2.0, q: 0.70710678}]
      - [Compressor, {threshold_db: -20.0, ratio: 4.0, attack_ms: 15.0, release_ms: 120.0}]
    drums:
      - [HighpassFilter, {cutoff_frequency_hz: 30.0}]
      - [PeakFilter, {cutoff_frequency_hz: 350.0, gain_db: -2.5, q: 0.70710678}]
      - [Compressor, {threshold_db: -16.0, ratio: 3.0, attack_ms: 10.0, release_ms: 80.0}]
  master:
    - [HighpassFilter, {cutoff_frequency_hz: 25.0}]
    - [PeakFilter, {cutoff_frequency_hz: 300.0, gain_db: -1.5, q: 0.7}]
    - [Compressor, {threshold_db: -12.0, ratio: 1.5, attack_ms: 30.0, release_ms: 200.0}]

bed: null
loudness: {lufs: -14.0, tol: 0.1, iters: 4, ceiling_dbtp: -1.0}

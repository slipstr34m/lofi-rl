# Shootout base palette (docs/SHOOTOUTS.md §7.8). Every shootout palette is this file with one candidate's block, its
# trim and its fader changed (§2.1 "one thing only"), written by `python -m lofi_rl.shootout.palettes`.
# - The band is the dev band (CD-7) under the shootout names (CD-1): keys `ep` = GU Tine EP 4, kit `dusty` = GU Jazz
#   kit 32 with GU Acoustic Bass 32, sax `tenor` = GU Tenor 66. There are no aliases: palette.py refuses an alias that
#   is also a palette name, and the loops name `ep` and `dusty` themselves.
# - groove, sax_expr, chords, voicings, the bus targets, the chains, the master, bed and loudness are dev_gu's
#   (palettes/dev_gu.yaml, sha256 b2e4a340...), pinned here from job 1 to the freeze (§3, "Drift between jobs").
# - Each pitched bus chain (sax, keys, bass) starts with its trim slot, [Gain, {gain_db: trim}] (CD-51); at 0 dB it
#   leaves the output bit-identical. A kit's trim goes on its lanes' db instead, and every fader on bus_gain_db.
# - sources: every candidate's SoundFont (§4), pinned in assets/MANIFEST.yaml. The §7.4 kit archives are added by
#   the generator from their importer outputs.
# Sound claims: none. It is not a shootout result and is never frozen.
